name: Example public-channel receipt

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  parity:
    name: ${{ matrix.os }} / ${{ matrix.channel }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            channel: npm
          - os: macos-latest
            channel: npm
          - os: macos-latest
            channel: homebrew
          - os: windows-latest
            channel: npm
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 24
          package-manager-cache: false
      - run: npm ci
      - run: npm run build
      - name: Probe one public channel
        uses: ./
        with:
          config: examples/channel-parity.example.json
          channel: ${{ matrix.channel }}
          output-directory: receipts/${{ matrix.os }}-${{ matrix.channel }}
